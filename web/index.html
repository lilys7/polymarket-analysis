<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polymarket spatial clusters</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #1c1f27;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --line: #2a2f3a;
      --accent: #8ab4f8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #c { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; top: 12px; left: 12px; width: 280px;
      background: var(--panel); border: 1px solid var(--line); padding: 12px 14px;
      max-height: calc(100% - 24px); overflow: auto;
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
    p, label, legend { color: var(--muted); margin: 0 0 8px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; }
    select, input[type="range"] { width: 100%; }
    select { background: var(--bg); color: var(--text); border: 1px solid var(--line); padding: 4px 6px; }
    button {
      background: var(--bg); color: var(--text); border: 1px solid var(--line);
      padding: 6px 8px; cursor: pointer; width: 100%;
    }
    button:hover { border-color: var(--accent); }
    #status { margin-top: 8px; font-variant-numeric: tabular-nums; }
    #pick {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    #pick b { color: var(--text); }
    #legend { margin-top: 10px; display: grid; gap: 4px; }
    .swatch { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 1px; flex: 0 0 8px; }
    kbd { color: var(--text); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <aside id="ui">
    <h1>Polymarket 3D execution space</h1>
    <p>Each point is one trader. Drag to rotate, scroll to zoom, right-drag to pan. Click a point for details.</p>
    <div class="row"><span>Color by</span></div>
    <select id="colorMode">
      <option value="cluster">Spatial cluster</option>
      <option value="label">Trader label</option>
      <option value="hhi">HHI (specialization)</option>
      <option value="ppv">PPV (profit rate)</option>
    </select>
    <div class="row"><label><input type="checkbox" id="hideNoise" /> Hide noise (−1)</label></div>
    <div class="row"><span>Point size</span></div>
    <input id="size" type="range" min="0.004" max="0.04" step="0.001" value="0.012" />
    <button id="reset" type="button">Reset camera</button>
    <div id="status">Loading point cloud…</div>
    <div id="pick">Click a point to inspect PnL, PPV, HHI, cluster, and label.</div>
    <div id="legend"></div>
  </aside>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
